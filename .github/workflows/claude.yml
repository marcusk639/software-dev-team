# @claude on issues and pull requests (anthropics/claude-code-action), as in
# recovery-platform. Mention @claude in an issue, a PR comment, a review or a
# review comment, and Claude answers or makes the change on a branch.
#
# Credentials: the CLAUDE_CODE_OAUTH_TOKEN secret (`claude setup-token`) when
# it is set, as recovery-platform and pr-review.yml use; otherwise the
# ANTHROPIC_API_KEY secret. GitHub access comes from the Claude GitHub App,
# which the action reaches through the job's OIDC token (id-token: write), so
# no personal access token is stored here.
#
# Every action is pinned by full commit SHA, as in pr-review.yml.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # The repository is public: only its owner, members and collaborators can
    # start a secret-bearing run. The action checks write access too; this
    # keeps everyone else's comments from even starting a job.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      # Agent-authored PRs must not reach the secret-bearing steps below: an
      # agent wrote their head, so it must never steer this job. Here those are
      # the Hermes/hco job branches (hco/*), plus e2e-fix/* as in
      # recovery-platform. Review events carry the head ref in the payload;
      # issue_comment needs a lookup; plain issues have no PR.
      - name: Skip agent-authored branches
        id: pr-head
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REVIEW_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          head_ref=""
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            # Any lookup failure exits non-zero (bash -e), failing the step and
            # skipping every later step: fail-closed.
            pr_url=$(gh api "repos/${REPO}/issues/${ISSUE_NUMBER}" --jq '.pull_request.url // empty')
            if [ -n "$pr_url" ]; then
              head_ref=$(gh api "repos/${REPO}/pulls/${ISSUE_NUMBER}" --jq '.head.ref')
            fi
          elif [ "$EVENT_NAME" = "pull_request_review" ] || [ "$EVENT_NAME" = "pull_request_review_comment" ]; then
            head_ref="$REVIEW_HEAD_REF"
          fi
          case "$head_ref" in
            hco/*|e2e-fix/*) echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Agent-authored branch $head_ref: skipped" ;;
            *) echo "skip=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Checkout repository
        if: steps.pr-head.outputs.skip != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      # So Claude can run this repo's checks (pnpm test, pnpm typecheck) on
      # what it changes. --ignore-scripts: no dependency's install script runs
      # in a job that can mint the OIDC token.
      - name: Set up Node
        if: steps.pr-head.outputs.skip != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install dependencies
        if: steps.pr-head.outputs.skip != 'true'
        run: |
          npm install -g pnpm@12.6.0
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Claude Code
        if: steps.pr-head.outputs.skip != 'true'
        id: claude
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          # The subscription token when the secret exists, else the API key;
          # never both, since Claude Code would prefer the API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}

          # Lets Claude read CI results on PRs.
          additional_permissions: |
            actions: read

          # This repo's checks, so a change Claude makes is verified the way a
          # contributor's is (see package.json).
          claude_args: >-
            --allowedTools "Bash(pnpm test:*),Bash(pnpm typecheck),Bash(node --import tsx --test:*)"
