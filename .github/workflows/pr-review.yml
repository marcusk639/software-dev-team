# Repo-aware, advisory PR review (marcusk639/pr-review-kit). It comments only:
# it never approves, never blocks and is never a required check. The design is
# docs/specs/pr-reviewer-design.md.
#
# The kit is pinned by full commit SHA, the same in every pr-review-kit
# `uses:` line here and in pr-review-learn.yml; a tag or branch would let the
# engine change under the pin. Every action is pinned by SHA: actions/checkout
# here, and the actions the kit uses internally inside the kit.
# Project config, knowledge and checks (.pr-review/) come from one trust SHA,
# the PR's base commit, which the review action resolves and hands to
# publish; never from the PR head.
name: PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, closed]
    # Only PRs into main. A stacked PR's base is a feature branch an agent
    # can push to, and the reviewer's rules would come from it (spec §7.1).
    branches: [main]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, forks (their runs get no secrets), Dependabot (likewise),
    # PRs whose base is not main (a PR retargeted after opening) and PRs
    # closed without merging. A merged PR whose head was already reviewed
    # gets tier none.
    if: >-
      ${{ (github.event.action != 'closed' || github.event.pull_request.merged)
      && !github.event.pull_request.draft
      && github.actor != 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Facts, then the sandboxed model. Gets the Claude token and nothing else.
      - name: Review
        id: review
        uses: marcusk639/pr-review-kit/actions/review@9e21ba2605bc083749b1bec176989dbfbda7b6d0
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      # Model-free; the only step with the id key and the advisory token.
      - name: Publish
        if: always()
        uses: marcusk639/pr-review-kit/actions/publish@9e21ba2605bc083749b1bec176989dbfbda7b6d0
        with:
          trust_sha: ${{ steps.review.outputs.trust_sha }}
          action_outcome: ${{ steps.review.outputs.outcome }}
          execution_file: ${{ steps.review.outputs.execution_file }}
          id_key: ${{ secrets.PR_REVIEW_ID_KEY }}
          advisory_token: ${{ secrets.SECURITY_ADVISORY_TOKEN }}
